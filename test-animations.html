<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verzet — Test Animaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #FFE000;
      --accent-hover: #E6CA00;
      --accent-dark:  #CCB300;
      --accent-soft:  #F0DC8C;
      --on-accent:    #111111;
      --bg-base:      #0d0d0d;
      --bg-surface:   #1a1a1a;
      --bg-surface-2: #242424;
      --bg-surface-3: #2e2e2e;
      --text:         #ffffff;
      --text-muted:   #999999;
      --text-faint:   #666666;
      --border:       #333333;
      --border-light: #444444;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
    }

    body {
      background: var(--bg-base);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 40px 80px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-bottom: 72px;
    }

    /* ── DEMO BLOCK ─────────────────────────────────────── */
    .demo {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 64px 0;
    }

    .demo + .demo { border-top: 1px solid var(--border); }

    .demo__header {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo__tag {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(255,107,53,0.35);
      background: rgba(255,107,53,0.08);
      padding: 4px 12px;
    }

    .demo__name {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    .demo__desc {
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.28);
    }

    /* ── LOGO STAGE ─────────────────────────────────────── */
    .logo-stage {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-row {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .logo-row .letter {
      height: 72px;
      width: auto;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ── BUTTON ─────────────────────────────────────────── */
    .btn-replay {
      background: transparent;
      border: 1px solid var(--border);
      color: rgba(255,255,255,0.35);
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      padding: 11px 30px;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }
    .btn-replay:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ═══════════════════════════════════════════════════════
       A — DROP SUAVE + ENCENDIDO L→R
       letras caen dim (incompletas) → sweep naranja → blanco
    ═══════════════════════════════════════════════════════ */

    /* caída suave: aterriza dim */
    @keyframes drop-soft {
      0%   { opacity: 0;    transform: translateY(-55px); }
      100% { opacity: 0.22; transform: translateY(0); }
    }

    /* encendido: dim → flash negro/gris → blanco */
    @keyframes complete-letter {
      0%   { opacity: 0.22; filter: brightness(1);    }
      35%  { opacity: 1;    filter: brightness(0.08); }
      100% { opacity: 1;    filter: brightness(1);    }
    }

    #demo-a .letter { opacity: 0; }

    /* drop delays: stagger 80ms */
    #demo-a .letter:nth-child(1) { --dd: 0.00s; --cd: 1.10s; }
    #demo-a .letter:nth-child(2) { --dd: 0.08s; --cd: 1.18s; }
    #demo-a .letter:nth-child(3) { --dd: 0.16s; --cd: 1.26s; }
    #demo-a .letter:nth-child(4) { --dd: 0.24s; --cd: 1.34s; }
    #demo-a .letter:nth-child(5) { --dd: 0.32s; --cd: 1.42s; }
    #demo-a .letter:nth-child(6) { --dd: 0.40s; --cd: 1.50s; }

    #demo-a.animate .letter {
      animation:
        drop-soft       0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--dd) forwards,
        complete-letter 0.60s ease-in-out                    var(--cd) forwards;
    }

    /* ═══════════════════════════════════════════════════════
       B — SCATTER → ASSEMBLE
    ═══════════════════════════════════════════════════════ */
    @keyframes assemble {
      0% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(var(--dr)) scale(0.4);
      }
      55% { opacity: 1; }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    #demo-b .letter:nth-child(1) { --dx: -190px; --dy: -55px;  --dr: -20deg; }
    #demo-b .letter:nth-child(2) { --dx: -95px;  --dy:  95px;  --dr:  15deg; }
    #demo-b .letter:nth-child(3) { --dx: -25px;  --dy: -140px; --dr: -10deg; }
    #demo-b .letter:nth-child(4) { --dx:  25px;  --dy:  120px; --dr:  18deg; }
    #demo-b .letter:nth-child(5) { --dx:  95px;  --dy: -85px;  --dr: -13deg; }
    #demo-b .letter:nth-child(6) { --dx:  190px; --dy:  60px;  --dr:  11deg; }

    #demo-b .letter { opacity: 0; }

    #demo-b.animate .letter {
      animation: assemble 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #demo-b.animate .letter:nth-child(1) { animation-delay: 0.04s; }
    #demo-b.animate .letter:nth-child(2) { animation-delay: 0.07s; }
    #demo-b.animate .letter:nth-child(3) { animation-delay: 0.10s; }
    #demo-b.animate .letter:nth-child(4) { animation-delay: 0.13s; }
    #demo-b.animate .letter:nth-child(5) { animation-delay: 0.16s; }
    #demo-b.animate .letter:nth-child(6) { animation-delay: 0.19s; }

    /* ═══════════════════════════════════════════════════════
       C — CURTAIN REVEAL
    ═══════════════════════════════════════════════════════ */
    @keyframes curtain {
      0%   { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0%   0 0); }
    }

    #demo-c .logo-row { clip-path: inset(0 100% 0 0); }

    #demo-c.animate .logo-row {
      animation: curtain 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }
  </style>
</head>
<body>

  <p class="page-title">Verzet — Test animaciones de entrada</p>

  <!-- ── A: BLADE DROP + SHIMMER ──────────────────────── -->
  <div class="demo" id="demo-a">
    <div class="demo__header">
      <span class="demo__tag">A — ELEGIDA</span>
      <span class="demo__name">Drop Suave + Encendido</span>
      <span class="demo__desc">caen dim → flash naranja de izq a der → blanco</span>
    </div>
    <div class="logo-stage">
      <div class="logo-row">
        <img src="assets/img/logo/letters/letter-v.svg"  class="letter" alt="V">
        <img src="assets/img/logo/letters/letter-e.svg"  class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-r.svg"  class="letter" alt="R">
        <img src="assets/img/logo/letters/letter-z.svg"  class="letter" alt="Z">
        <img src="assets/img/logo/letters/letter-e2.svg" class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-t.svg"  class="letter" alt="T">
      </div>
    </div>
    <button class="btn-replay" onclick="replay('demo-a')">↺ &thinsp; repetir</button>
  </div>

  <!-- ── B: SCATTER → ASSEMBLE ────────────────────────── -->
  <div class="demo" id="demo-b">
    <div class="demo__header">
      <span class="demo__tag">B</span>
      <span class="demo__name">Scatter → Assemble</span>
      <span class="demo__desc">letras desparramadas que se ensamblan de golpe</span>
    </div>
    <div class="logo-stage">
      <div class="logo-row">
        <img src="assets/img/logo/letters/letter-v.svg"  class="letter" alt="V">
        <img src="assets/img/logo/letters/letter-e.svg"  class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-r.svg"  class="letter" alt="R">
        <img src="assets/img/logo/letters/letter-z.svg"  class="letter" alt="Z">
        <img src="assets/img/logo/letters/letter-e2.svg" class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-t.svg"  class="letter" alt="T">
      </div>
    </div>
    <button class="btn-replay" onclick="replay('demo-b')">↺ &thinsp; repetir</button>
  </div>

  <!-- ── C: CURTAIN REVEAL ──────────────────────────────── -->
  <div class="demo" id="demo-c">
    <div class="demo__header">
      <span class="demo__tag">C</span>
      <span class="demo__name">Curtain Reveal</span>
      <span class="demo__desc">persiana que barre de izquierda a derecha</span>
    </div>
    <div class="logo-stage">
      <div class="logo-row">
        <img src="assets/img/logo/letters/letter-v.svg"  class="letter" alt="V">
        <img src="assets/img/logo/letters/letter-e.svg"  class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-r.svg"  class="letter" alt="R">
        <img src="assets/img/logo/letters/letter-z.svg"  class="letter" alt="Z">
        <img src="assets/img/logo/letters/letter-e2.svg" class="letter" alt="E">
        <img src="assets/img/logo/letters/letter-t.svg"  class="letter" alt="T">
      </div>
    </div>
    <button class="btn-replay" onclick="replay('demo-c')">↺ &thinsp; repetir</button>
  </div>

  <script>
    function replay(id) {
      const el = document.getElementById(id);
      el.classList.remove('animate');
      void el.offsetWidth;
      requestAnimationFrame(() => el.classList.add('animate'));
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('demo-a').classList.add('animate');
        setTimeout(() => document.getElementById('demo-b').classList.add('animate'), 200);
        setTimeout(() => document.getElementById('demo-c').classList.add('animate'), 400);
      }, 500);
    });
  </script>

</body>
</html>
