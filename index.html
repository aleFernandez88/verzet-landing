<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verzet</title>
  <meta name="description" content="Verzet — Equipate para la aventura. Uruguay · Argentina · Brasil.">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="canonical" href="https://alefernandez88.github.io/verzet-landing/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Verzet">
  <meta property="og:description" content="Verzet — Equipate para la aventura. Uruguay · Argentina · Brasil.">
  <meta property="og:url" content="https://alefernandez88.github.io/verzet-landing/">
  <meta property="og:image" content="assets/img/og-image.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Verzet">
  <meta name="twitter:description" content="Verzet — Equipate para la aventura. Uruguay · Argentina · Brasil.">
  <meta name="twitter:image" content="assets/img/og-image.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Verzet",
    "url": "https://alefernandez88.github.io/verzet-landing/",
    "logo": "https://alefernandez88.github.io/verzet-landing/assets/img/og-image.jpg",
    "sameAs": [
      "https://verzet.com.uy",
      "https://verzet.com.ar"
    ]
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
  <link rel="preload" as="image" href="assets/img/bg/uy.webp">
  <link rel="preload" as="image" href="assets/img/bg/ar.webp">
  <link rel="preload" as="image" href="assets/img/bg/br.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="logo-global">
    <div class="logo-wrap" id="logo-wrap">
      <img src="assets/img/logo/letters/letter-v.svg"  class="logo-letter" alt="V" width="190" height="212">
      <img src="assets/img/logo/letters/letter-e.svg"  class="logo-letter" alt="E" width="186" height="212">
      <img src="assets/img/logo/letters/letter-r.svg"  class="logo-letter" alt="R" width="208" height="213">
      <img src="assets/img/logo/letters/letter-z.svg"  class="logo-letter" alt="Z" width="201" height="212">
      <img src="assets/img/logo/letters/letter-e2.svg" class="logo-letter" alt="E" width="185" height="212">
      <img src="assets/img/logo/letters/letter-t.svg"  class="logo-letter" alt="T" width="184" height="212">
    </div>
  </div>

  <main class="strips">

    <!-- Uruguay -->
    <a href="https://verzet.com.uy" class="strip strip--uy" aria-label="Verzet Uruguay">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">Uruguay</span>
          <span class="strip__domain-full">verzet.com.uy</span>
          <span class="strip__cta">Ingresar</span>
        </div>
      </div>
    </a>

    <!-- Argentina -->
    <a href="https://verzet.com.ar" class="strip strip--ar" aria-label="Verzet Argentina">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">Argentina</span>
          <span class="strip__domain-full">verzet.com.ar</span>
          <span class="strip__cta">Ingresar</span>
        </div>
      </div>
    </a>

    <!-- Brasil -->
    <a href="https://verzet.com.br" class="strip strip--br" aria-label="Verzet Brasil">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">Brasil</span>
          <span class="strip__domain-full">verzet.com.br</span>
          <span class="strip__cta">Acessar</span>
        </div>
      </div>
    </a>

  </main>

  <div class="coming-overlay" id="coming-overlay" role="dialog" aria-modal="true" aria-label="Próximamente">
    <div class="coming-content">
      <p class="coming-domain" id="coming-domain"></p>
      <p class="coming-label" id="coming-label"></p>
      <button class="coming-back" id="coming-close">← Volver</button>
    </div>
    <div class="coming-border-b"></div>
  </div>

  <script>
    // Intro: sincroniza el logo y las 3 franjas en un único reveal, en vez de que
    // cada imagen aparezca por separado según la velocidad de conexión de cada visitante.
    const INTRO_SEEN_KEY = 'verzetIntroSeen';
    const MIN_INTRO_MS = 700;   // piso: asegura que la animación se vea siempre, aunque las imágenes ya estén en caché
    const MAX_WAIT_MS  = 4000;  // techo: nunca deja al visitante esperando una imagen rota/lentísima

    const logoWrap   = document.getElementById('logo-wrap');
    const logoGlobal = document.querySelector('.logo-global');
    const bgEls = Array.from(document.querySelectorAll('.strip__bg'));

    function reveal(withIntro) {
      bgEls.forEach(bg => bg.classList.add('loaded'));
      logoWrap.classList.add(withIntro ? 'animate' : 'skip-intro');
      // En mobile los strips se apilan y el logo centrado queda sobre el nombre
      // de la primera franja: una vez que se vio completo, se achica a la esquina.
      const settleDelay = withIntro ? 2200 : 500;
      setTimeout(() => logoGlobal.classList.add('settled'), settleDelay);
    }

    if (sessionStorage.getItem(INTRO_SEEN_KEY)) {
      reveal(false);
    } else {
      const imagesReady = Promise.all(bgEls.map(bg => new Promise(resolve => {
        const url = getComputedStyle(bg).backgroundImage.slice(5, -2); // strip url("...")
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve;
        img.src = url;
      })));
      const minDelay = new Promise(resolve => setTimeout(resolve, MIN_INTRO_MS));
      const maxWait  = new Promise(resolve => setTimeout(resolve, MAX_WAIT_MS));

      Promise.race([Promise.all([imagesReady, minDelay]), maxWait]).then(() => {
        sessionStorage.setItem(INTRO_SEEN_KEY, '1');
        reveal(true);
      });
    }

    // Coming soon overlay
    const overlay      = document.getElementById('coming-overlay');
    const comingLabel  = document.getElementById('coming-label');
    const comingDomain = document.getElementById('coming-domain');

    const comingSoon = {
      br: { label: 'Em breve', domain: 'verzet.com.br' }
    };

    const closeBtn = document.getElementById('coming-close');
    let lastTrigger = null;

    document.querySelectorAll('.strip--br').forEach(strip => {
      strip.addEventListener('click', e => {
        e.preventDefault();
        lastTrigger = strip;
        const d = comingSoon.br;
        comingLabel.textContent  = d.label;
        comingDomain.textContent = d.domain;
        overlay.classList.add('active');
        closeBtn.focus();
      });
    });

    function closeOverlay() {
      overlay.classList.remove('active');
      if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
    }

    closeBtn.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
    document.addEventListener('keydown', e => {
      if (!overlay.classList.contains('active')) return;
      if (e.key === 'Escape') closeOverlay();
      // Único elemento enfocable dentro del modal: mantiene el foco atrapado ahí.
      if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
    });
  </script>

</body>
</html>
