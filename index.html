<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verzet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #ff6b35;
      --bg:           #0d0d0d;
      --border:       #333333;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --ease:         cubic-bezier(0.77, 0, 0.175, 1);
      --dur:          0.65s;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── LOGO ───────────────────────────────────────────────── */
    .logo-global {
      position: fixed;
      top: clamp(60px, 20vh, 160px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .logo-letter {
      height: clamp(32px, 4vw, 52px);
      width: auto;
      display: block;
      opacity: 0;
    }

    .logo-letter:nth-child(1) { --dd: 0.00s; --cd: 1.10s; }
    .logo-letter:nth-child(2) { --dd: 0.08s; --cd: 1.18s; }
    .logo-letter:nth-child(3) { --dd: 0.16s; --cd: 1.26s; }
    .logo-letter:nth-child(4) { --dd: 0.24s; --cd: 1.34s; }
    .logo-letter:nth-child(5) { --dd: 0.32s; --cd: 1.42s; }
    .logo-letter:nth-child(6) { --dd: 0.40s; --cd: 1.50s; }

    @keyframes drop-soft {
      0%   { opacity: 0;    transform: translateY(-55px); }
      100% { opacity: 0.22; transform: translateY(0);     }
    }

    @keyframes complete-letter {
      0%   { opacity: 0.22; filter: brightness(1);    }
      35%  { opacity: 1;    filter: brightness(0.08); }
      100% { opacity: 1;    filter: brightness(1);    }
    }

    .logo-wrap.animate .logo-letter {
      animation:
        drop-soft       0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--dd) forwards,
        complete-letter 0.60s ease-in-out                    var(--cd) forwards;
    }

    /* ── STRIPS ─────────────────────────────────────────────── */
    .strips {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .strip {
      position: relative;
      flex: 1;
      text-decoration: none;
      border-right: 1px solid var(--border);
      transition: flex var(--dur) var(--ease);
    }

    .strip:last-child { border-right: none; }

    .strips:has(.strip--uy:hover) .strip--uy,
    .strips:has(.strip--ar:hover) .strip--ar,
    .strips:has(.strip--br:hover) .strip--br { flex: 1.9; }

    .strips:has(.strip--uy:hover) .strip--ar,
    .strips:has(.strip--uy:hover) .strip--br,
    .strips:has(.strip--ar:hover) .strip--uy,
    .strips:has(.strip--ar:hover) .strip--br,
    .strips:has(.strip--br:hover) .strip--uy,
    .strips:has(.strip--br:hover) .strip--ar { flex: 0.55; }

    /* ── BACKGROUND ────────────────────────────────────────── */
    .strip__bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform var(--dur) var(--ease);
      will-change: transform;
      z-index: 0;
    }

    .strip:hover .strip__bg { transform: scale(0.97); }

    .strip--uy .strip__bg { background: url('assets/img/bg/uy.jpg') center/cover no-repeat; }
    .strip--ar .strip__bg { background: url('assets/img/bg/ar.jpg') center/cover no-repeat; }
    .strip--br .strip__bg { background: url('assets/img/bg/br.jpg') center/cover no-repeat; }

    /* ── OVERLAY ────────────────────────────────────────────── */
    .strip__overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      transition: background var(--dur) var(--ease);
      z-index: 1;
    }

    .strip:hover .strip__overlay { background: rgba(0, 0, 0, 0.82); }

    /* ── INNER ──────────────────────────────────────────────── */
    .strip__inner {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    /* ── BORDER LINES ───────────────────────────────────────── */
    .strip__border-b {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform var(--dur) var(--ease);
      z-index: 3;
    }

    .strip:hover .strip__border-b { transform: scaleX(1); }

    .strip__border-s {
      position: absolute;
      top: 0;
      right: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top center;
      transition: transform var(--dur) var(--ease);
      z-index: 3;
    }

    .strip--br .strip__border-s { right: auto; left: 0; }

    .strip:hover .strip__border-s { transform: scaleY(1); }

    /* ── CONTENT ────────────────────────────────────────────── */
    .strip__content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 2rem;
    }

    .strip__tld {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 62px;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .strip:hover .strip__tld {
      opacity: 0;
      transform: translateY(-6px);
    }

    .strip__domain-full {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.1rem, 2.8vw, 3.4rem);
      color: var(--accent);
      letter-spacing: 0.06em;
      text-transform: lowercase;
      line-height: 1;
      position: absolute;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
      white-space: nowrap;
    }

    .strip:hover .strip__domain-full {
      opacity: 1;
      transform: translateY(0);
    }

    .strip__cta {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(0.5rem, 0.85vw, 0.72rem);
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      margin-top: 2.8rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }

    .strip:hover .strip__cta {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── MOBILE PORTRAIT ────────────────────────────────────── */
    @media (max-width: 768px) and (orientation: portrait) {
      .logo-global { top: clamp(40px, 12vh, 80px); }

      .strips { flex-direction: column; }

      .strip {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .strip:last-child { border-bottom: none; }

      .strip__border-b {
        bottom: auto;
        top: 0;
        left: auto;
        right: 0;
        width: 3px;
        height: 100%;
        transform: scaleY(0);
        transform-origin: top center;
      }

      .strip:hover .strip__border-b { transform: scaleY(1); }

      .strip__border-s {
        top: auto;
        right: auto;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 3px;
        transform: scaleX(0);
        transform-origin: left center;
      }

      .strip--br .strip__border-s { left: 0; }

      .strip:hover .strip__border-s { transform: scaleX(1); }

      .strip__tld         { font-size: clamp(2.2rem, 10vw, 4rem); }
      .strip__domain-full { font-size: clamp(0.9rem, 4vw, 1.6rem); }
    }

    @media (max-height: 480px) {
      .strip__cta { display: none; }
    }
  </style>
</head>
<body>

  <div class="logo-global">
    <div class="logo-wrap" id="logo-wrap">
      <img src="assets/img/logo/letters/letter-v.svg"  class="logo-letter" alt="V">
      <img src="assets/img/logo/letters/letter-e.svg"  class="logo-letter" alt="E">
      <img src="assets/img/logo/letters/letter-r.svg"  class="logo-letter" alt="R">
      <img src="assets/img/logo/letters/letter-z.svg"  class="logo-letter" alt="Z">
      <img src="assets/img/logo/letters/letter-e2.svg" class="logo-letter" alt="E">
      <img src="assets/img/logo/letters/letter-t.svg"  class="logo-letter" alt="T">
    </div>
  </div>

  <main class="strips">

    <!-- Uruguay -->
    <a href="https://verzet.uy" class="strip strip--uy" aria-label="Verzet Uruguay">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">.uy</span>
          <span class="strip__domain-full">verzet.com.uy</span>
          <span class="strip__cta">Ingresar</span>
        </div>
      </div>
    </a>

    <!-- Argentina -->
    <a href="https://verzet.com.ar" class="strip strip--ar" aria-label="Verzet Argentina">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">.ar</span>
          <span class="strip__domain-full">verzet.com.ar</span>
          <span class="strip__cta">Ingresar</span>
        </div>
      </div>
    </a>

    <!-- Brasil -->
    <a href="https://verzet.com.br" class="strip strip--br" aria-label="Verzet Brasil">
      <div class="strip__bg"></div>
      <div class="strip__overlay"></div>
      <div class="strip__inner">
        <div class="strip__border-b"></div>
        <div class="strip__border-s"></div>
        <div class="strip__content">
          <span class="strip__tld">.br</span>
          <span class="strip__domain-full">verzet.com.br</span>
          <span class="strip__cta">Acessar</span>
        </div>
      </div>
    </a>

  </main>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('logo-wrap').classList.add('animate');
      }, 300);
    });
  </script>

</body>
</html>
